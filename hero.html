<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello</title>
<style>
  :root { --bg:#ffffff; --ease:cubic-bezier(0.23,1,0.32,1); }
  @media (prefers-color-scheme: dark) { :root { --bg:#191919; } }
  * { box-sizing:border-box; margin:0; }
  html,body { background:var(--bg); height:100%; }
  body { font:13px/1.4 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; padding:6px 8px; -webkit-font-smoothing:antialiased; }
  .card { position:relative; height:calc(100vh - 12px); min-height:176px; border-radius:18px; overflow:hidden; color:var(--ink); background:linear-gradient(170deg,var(--s1),var(--s2) 70%,var(--s3)); }
  .card[data-p=morning]   { --s1:#f8e6d6; --s2:#f7d8c6; --s3:#f3c9b4; --ink:#3d2f2a; --muted:#7d665c; --hill:#e9b8a1; }
  .card[data-p=afternoon] { --s1:#cfe2f5; --s2:#e4eef8; --s3:#f3f1ea; --ink:#26323f; --muted:#5d6b78; --hill:#c3d6c4; }
  .card[data-p=evening]   { --s1:#2f3b63; --s2:#7b6688; --s3:#e2a283; --ink:#fff8f2; --muted:#f0dcd2; --hill:#3a3352; }
  .card[data-p=night]     { --s1:#0f1428; --s2:#1c2340; --s3:#2e3356; --ink:#f1f2fa; --muted:#b5b9d3; --hill:#0b0f20; }
  .land { position:absolute; left:0; right:0; bottom:0; width:100%; height:38%; display:block; }
  .orb { position:absolute; right:14%; border-radius:50%; }
  .stars { position:absolute; inset:0; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; }
  .text { position:relative; height:100%; display:flex; flex-direction:column; justify-content:center; padding:20px 32px; max-width:62%; animation:in 700ms var(--ease) both; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } }
  .hi { font-family:Georgia,"Times New Roman",serif; font-size:clamp(28px,4.2vw,44px); line-height:1.12; letter-spacing:-0.01em; text-wrap:balance; }
  .hi em { font-style:italic; }
  .date { margin-top:8px; color:var(--muted); font-size:14px; }
  .year { margin-top:18px; max-width:280px; }
  .bar { height:5px; border-radius:5px; background:color-mix(in srgb,var(--ink) 16%,transparent); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--ink); opacity:.75; border-radius:5px; }
  .year small { display:block; margin-top:6px; color:var(--muted); font-size:12px; }
  .name { margin-top:10px; align-self:flex-start; font:inherit; font-size:12px; color:var(--muted); background:none; border:0; padding:4px 0; cursor:pointer; }
  .name:hover { color:var(--ink); }
  .name:focus-visible { outline:2px solid var(--ink); outline-offset:2px; border-radius:4px; }
  input { font:inherit; font-size:13px; padding:6px 10px; border-radius:8px; border:1px solid color-mix(in srgb,var(--ink) 30%,transparent); background:color-mix(in srgb,#fff 80%,transparent); color:#333; width:180px; margin-top:10px; }
  .phase { position:absolute; right:14%; font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
  @media (max-width:520px) { .text { max-width:100%; padding:16px 18px; justify-content:flex-start; } .hi { font-size:26px; } .orb, .phase { right:8%; } .year { margin-top:12px; } }
  @media (prefers-reduced-motion:reduce) { .text { animation:none; } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="orb" id="orb" aria-hidden="true"></div>
  <div class="phase" id="phase"></div>
  <svg class="land" viewBox="0 0 1000 120" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 70 C150 30 300 60 450 48 S750 20 1000 52 V120 H0Z" fill="var(--hill)" opacity=".45"/>
    <path d="M0 96 C200 66 380 92 560 78 S850 62 1000 84 V120 H0Z" fill="var(--hill)" opacity=".8"/>
  </svg>
  <div class="text">
    <div class="hi" id="hi"></div>
    <div class="date" id="date"></div>
    <div class="year"><div class="bar"><i id="bar"></i></div><small id="yr"></small></div>
    <button class="name" id="nameBtn" type="button"></button>
  </div>
</div>
<script>
const KEY = 'planner-name';
const now = new Date(), h = now.getHours();
const part = h < 5 ? 'night' : h < 12 ? 'morning' : h < 17 ? 'afternoon' : h < 21 ? 'evening' : 'night';
const hello = { morning:'Good morning', afternoon:'Good afternoon', evening:'Good evening', night:'Good night' }[part];
const card = document.getElementById('card'); card.dataset.p = part;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  const name = localStorage.getItem(KEY) || '';
  document.getElementById('hi').innerHTML = name ? `${hello},<br><em>${esc(name)}</em>` : hello;
  document.getElementById('nameBtn').textContent = name ? 'Change name' : '+ Add your name';
}
document.getElementById('nameBtn').onclick = () => {
  const b = document.getElementById('nameBtn');
  const i = document.createElement('input'); i.placeholder = 'Your first name'; i.maxLength = 24; i.value = localStorage.getItem(KEY) || '';
  b.replaceWith(i); i.focus();
  const done = () => { const v = i.value.trim(); v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); i.replaceWith(b); render(); };
  i.onkeydown = e => { if (e.key === 'Enter') done(); if (e.key === 'Escape') i.replaceWith(b); };
  i.onblur = done;
};
document.getElementById('date').textContent = now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
const start = new Date(now.getFullYear(), 0, 1), end = new Date(now.getFullYear() + 1, 0, 1);
const day = Math.floor((now - start) / 864e5) + 1, total = Math.round((end - start) / 864e5);
document.getElementById('bar').style.width = (day / total * 100).toFixed(1) + '%';
document.getElementById('yr').textContent = `Day ${day} of ${total} · ${total - day} days left in ${now.getFullYear()}`;
render();

// sky: a sun by day, tonight's real moon phase after dark
const orb = document.getElementById('orb'), dark = part === 'evening' || part === 'night';
const S = 'min(30vh, 22vw)';
if (!dark) {
  const sun = part === 'morning' ? '#ffd9a8' : '#fff4d6';
  orb.style.cssText = `width:${S};height:${S};top:${part === 'morning' ? '24%' : '12%'};background:radial-gradient(circle,${sun} 0 38%,color-mix(in srgb,${sun} 45%,transparent) 39%,transparent 70%);`;
} else {
  const syn = 29.530588853, p = (((now - Date.UTC(2000, 0, 6, 18, 14)) / 864e5) % syn + syn) % syn / syn;
  const r = 40, rx = r * Math.abs(Math.cos(2 * Math.PI * p)), wax = p < 0.5;
  const a1 = wax ? 1 : 0, a2 = wax ? (p < 0.25 ? 0 : 1) : (p > 0.75 ? 1 : 0);
  const lit = `M50 10 A40 40 0 0 ${a1} 50 90 A${rx.toFixed(2)} 40 0 0 ${a2} 50 10Z`;
  orb.style.cssText = `width:${S};height:${S};top:14%;`;
  orb.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%"><defs><radialGradient id="gl"><stop offset=".4" stop-color="#fff6dd" stop-opacity=".22"/><stop offset="1" stop-color="#fff6dd" stop-opacity="0"/></radialGradient></defs>
    <circle cx="50" cy="50" r="50" fill="url(#gl)"/><circle cx="50" cy="50" r="40" fill="#fff" opacity=".10"/><path d="${lit}" fill="#fbf3dc"/></svg>`;
  const names = ['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];
  const ph = document.getElementById('phase'); ph.textContent = names[Math.round(p * 8) % 8];
  ph.style.top = `calc(14% + ${S} + 4px)`; ph.style.width = S; ph.style.textAlign = 'center';
  const st = document.getElementById('stars');
  const seed = [[8,12],[18,30],[30,8],[44,18],[56,6],[63,28],[70,10],[82,24],[90,8],[95,34],[52,40],[36,34]];
  st.innerHTML = seed.map(([x, y], i) => `<i style="left:${x}%;top:${y}%;opacity:${part === 'night' ? .35 + (i % 3) * .2 : .15 + (i % 3) * .1}"></i>`).join('');
}
</script>
</body>
</html>
